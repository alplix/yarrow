[package]
name = "yarrow-share"
description = "Opt-in sharing for Yarrow Hub: BOINC account, offline city list, upload client and a mock server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yarrow-core = { path = "../yarrow-core" }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

# The operating system's credential store: only the account key goes in, never the password.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[lints]
workspace = true
