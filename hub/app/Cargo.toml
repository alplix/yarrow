[package]
name = "yarrow-hub"
description = "Yarrow Hub: desktop program for the Yarrow radiation-detector firmware"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
default-run = "yarrow-hub"

[lib]
name = "yarrow_hub"

[[bin]]
name = "yarrow-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yarrow-core = { path = "../crates/yarrow-core" }
yarrow-store = { path = "../crates/yarrow-store" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

