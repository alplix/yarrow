[package]
name = "yarrow-core"
description = "Serial client and log decoder for the Yarrow radiation-detector firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serialport = { version = "4", default-features = false }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
