[workspace]
resolver = "2"
members = ["crates/yarrow-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alp"]
license = "GPL-3.0-or-later"
repository = "https://github.com/alplix/yarrow"

[workspace.lints.rust]
unreachable_pub = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
